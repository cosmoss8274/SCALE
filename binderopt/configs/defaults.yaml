n_iterations: 30
mutants_per_round: 5
top_n_for_sampling: 30
checkpoint_frequency: 1
esm2_model: esm2_t36_3B_UR50D
surrogate_model: random_forest
batch_size_gpu: 8
batch_size_cpu: 32
amino_acids: ACDEFGHIKLMNPQRSTVWY
use_af3: true
use_protenix: false
calculate_rmsd: true
af3_db_dir: ${SCALE_AF3_DB_DIR}
af3_model_dir: ${SCALE_AF3_MODEL_DIR}
metric_weights:
  plddt: -3.0
  i_ptm: 10.0
  pae_intra: -1.5
  pae_inter: -4.0
  con_intra: -0.15
  con_inter: -1.0
  rg: 0.0
  helix: 0.0
  termini: 0.0
  l_rmsd: -1.0
  nll: -1.0
af3_thresholds:
  min_pae_interaction: 1.5
  ptm_binder: 0.76
  l_rmsd: 2.5
learn_weights: false
weight_retrain_start: 0
weight_retrain_interval: 9999
injection_enabled: false
injection_interval: 3
n_seqs_to_inject: 50
injection_sources: {}
use_injected_as_parents: true
active_nll_scoring: true
initial_nll_score_limit: 9999
residue_sampling:
  combined_mutations_per_seq: 70
  random_mutations_total: 20
  residue_weights:
    interface_score: 0.5
    packing_score: 0.15
    confidence_score: 0.3
    helix_score: 0.05
  min_mutations: 1
  max_mutations: 4
  badness_sharpening: 4.0
  random_mutations_per_seq: 25
rf_params:
  n_estimators: 100
  criterion: friedman_mse
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  bootstrap: true
  n_jobs: -1
  random_state: 1
