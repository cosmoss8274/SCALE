# BHRF1 target config.
target_name: bhrf1

target_sequence: "GSHHHHHHSQDPMAYSTREILLALCIRDSRVHGNGTLHPVLELAARETPLRLSPEDTVVLRYHVLLEEIIERNSETFTETWNRFITHTEHVDLDFNSVFLEIFHRGDPSLGRALAWMAWCMHACRTLCCNQSTPYYVVDLSVRGMLEASEGLDGWIH"

af3_structure_dir: "${SCALE_ASSETS}/af3_rfdiffusion_bhrf1_final"
af3_target_msa_dir: "${SCALE_ASSETS}/target_msa_cache"
reference_structures_dir: "${SCALE_ASSETS}/targets/designbb"
calculate_rmsd: false

# Raw RFdiffusion/AF3 summary CSV (columns: binder_sequence, structure_dir, iptm, ptm,
# ranking_score). binderopt.targets.ensure_benchmark_csv() converts this to the benchmark
# schema (sequence, target_sequence, target, ..., af3_output_dir, ...) that the optimizer
# expects, writing the result next to it as benchmark_bhrf1_rfdiffusion.csv the first time
# this target is run; design.py calls ensure_benchmark_csv() before optimizer.run().
rfdiffusion_csv_path: "${SCALE_ASSETS}/af3_rfdiffusion_bhrf1_final/af3_predictions_summary.csv"
initial_csv: "${SCALE_ASSETS}/af3_rfdiffusion_bhrf1_final/benchmark_bhrf1_rfdiffusion.csv"

n_iterations: 30
mutants_per_round: 30
top_n_for_sampling: 30

af3_thresholds:
  min_pae_interaction: 1.5
  ptm_binder: 0.7
  l_rmsd: 2.5

metric_weights:
  nll: -25.0
