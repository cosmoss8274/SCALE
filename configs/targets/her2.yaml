# HER2/ERBB2 target config. Built from an RFdiffusion benchmark CSV
# (an RFdiffusion-origin target; no template-redesign reference set exists).
target_name: her2

# Domain III+IV only (mature residues 253-620, 368aa) -- matches exactly the
# structural context used by RFdiffusion (contig A253-620 of 3N85.pdb chain A).
# Using the same region for AF3 evaluation ensures binder is assessed against
# the same domain surface it was designed for, preventing AF3 from docking
# the binder to domain I/II instead (which happened with the full 620aa ECD).
target_sequence: ""

# STALE -- generated by a run script that intended to target HER2
# Domain IV (Trastuzumab epitope, full-length residue ~489-630 / mature ~467-608)
# via ppi.hotspot_res=[A512,...,A555] (mature numbering) against PDB 3N85.
# Verified directly (BioPython parse of the actual generated backbones, e.g.
# designs/Her2_binder_20260111_215235/backbones/her2_binder_0.pdb) that the
# 3-segment contig "A1-100,A111-247,A253-620" did NOT retain segments 2/3 in
# practice -- every existing binder's target chain is only mature residues
# 1-100 (Domain I), nowhere near the intended hotspots. This whole CSV's
# binders are scientifically invalid for a Domain IV therapeutic goal.
# Regenerate via `prepare_seed_data.py --target_name her2` (uses the corrected
# single-segment Domain IV contig in `seeding:` below) before running design.py
# for real. See conversation/session notes for the full investigation.
initial_csv: "${SCALE_RESULTS}/her2_seed_data/benchmark_her2.csv"

# Seed-data generation params for prepare_seed_data.py. Single contiguous
# contig segment (mature numbering), revised from an earlier domain-IV-only
# crop (A480-620) after AF3 evaluation showed those binders failing to
# actually dock domain IV in the full-length context. Root cause: domain IV
# in isolation exposes surface that's partly buried against domain III in the
# real folded ECD, so binders designed against the bare 142-residue domain IV
# fragment target a "fake" exposed surface. Fix: crop to the domain III+IV
# tandem repeat unit together (HER2's ECD is two L-domain+CRD repeats:
# domain I+II, then domain III+IV -- giving RFdiffusion domain III restores
# domain IV's true native packing context/surface). A1-620 minus the two gaps
# would be even more complete but the old 3-segment whole-ECD contig
# demonstrably failed to retain its later segments in this RFdiffusion
# version (see initial_csv staleness note above) -- this single contiguous
# segment is the more robust middle ground. Verified via BioPython against
# PDB 3N85 chain A that residues 253-620 are 100% contiguous
# (zero gaps -- the structure's only two gaps are at 100-111 and 247-253,
# both below this window) and contain all 18 hotspot residues.
seeding:
  target_pdb: "${SCALE_ASSETS}/pos_neg/3N85.pdb"
  contig: "100-100/0 A253-620"
  # Ground-truth Trastuzumab/Herceptin contact residues, computed directly
  # (BioPython NeighborSearch, 4.5A heavy-atom cutoff) from the real Herceptin
  # Fab : HER2-ECD co-crystal structure PDB 1N8Z (downloaded from
  # files.rcsb.org), NOT from a secondary
  # text description. 1N8Z chain C uses mature numbering (residue 1 = Thr),
  # same convention as 3N85 chain A used for contigmap above, so no offset
  # conversion needed. Supersedes two earlier wrong attempts: (1) the old
  # run_pos_rfd.sh hotspot list (512-555), which turned out to be mid-domain,
  # not the real epitope; (2) a manually "corrected" 535-581 list derived by
  # applying a spurious -22 mature/full-length offset to a secondhand patent
  # description -- the offset was unnecessary and wrong. This list (19
  # residues) is the actual computed contact set; range 557-605.
  hotspot_residues:
    - "A557"
    - "A558"
    - "A560"
    - "A561"
    - "A569"
    - "A570"
    - "A571"
    - "A572"
    - "A573"
    - "A579"
    - "A591"
    - "A593"
    - "A596"
    - "A598"
    - "A600"
    - "A602"
    - "A603"
    - "A604"
    - "A605"
  binder_length: 100
  n_backbones: 15
  n_sequences_per_backbone: 50

# CSV's af3_output_dir column holds relative names like "her2_binder_0_seq0"; confirmed
# by inspection that ${SCALE_ASSETS}/specificity/af3_her2_binders/her2_binder_0_seq0/
# contains real AF3 outputs (*_model.cif, *_confidences.json, *_summary_confidences.json), so this
# is the correct af3_structure_dir (NOT a guess -- verified the directory contents directly).
af3_structure_dir: "${SCALE_RESULTS}/her2_seed_data/af3_structures"
af3_target_msa_dir: "${SCALE_ASSETS}/target_msa_cache"

# HER2 is an RFdiffusion-origin target with no dedicated reference/RMSD set in the old
# code (unlike MYB's template-redesign reference dir). Disable RMSD rather than inventing
# a reference dir, and drop l_rmsd from the effective metric_weights/thresholds since there
# is nothing to compute it against.
calculate_rmsd: false
metric_weights:
  l_rmsd: 0.0
  nll: -15.0
af3_thresholds:
  l_rmsd: null

n_iterations: 30
mutants_per_round: 30
top_n_for_sampling: 30

# No HER2-specific weight/threshold tuning existed in the old code; inherit defaults.yaml
# (other than the l_rmsd override above).

# Selectivity (HER2 vs EGFR dual-target scoring) intentionally left unset here: this is the
# single-target HER2-only example. The selectivity code path in binderopt/optimizer.py still
# exists (ProteinOptimizer(neg_interface=...)) but is only exercised if design.py is given
# a target yaml that defines a `selectivity` block with an off-target sequence/name.
