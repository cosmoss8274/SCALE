# MYB target config.
target_name: myb

# The original MYB pipeline defined a dual-chain target (MYB_B0 + MYB_A0). The optimizer core here
# is single-target (one AlphaFold3Interface target sequence); use MYB_B0 (the shorter,
# primary chain in the original 2-chain complex) as the single target sequence for this
# refactor's myb.yaml. TODO(user): if your real MYB campaign requires the full 2-chain
# (B0+A0) target complex, extend AlphaFold3Interface call sites in design.py to pass both
# target_names/target_sequences instead of a single sequence (the interface class itself
# already supports a list of targets; only design.py's single-target wiring would need updating).
target_sequence: "RDDIDMLKELGSLTTANLMEKVRGLQNLAYQLGLDESREMTRGKFLNILEKPKK"

reference_structures_dir: "${SCALE_ASSETS}/my_design/myb/mbd_redesign_106"
af3_structure_dir: "${SCALE_ASSETS}/my_design/myb/af3_pred_106"
af3_target_msa_dir: "${SCALE_ASSETS}/my_design/myb/mbd_redesign_106/af3_target_msa"

# Verified to exist on disk.
initial_csv: "${SCALE_ASSETS}/my_design/myb/mbd_redesign_106/designed_binders_af3_n1c5_random1000.csv"

n_iterations: 10
mutants_per_round: 30
top_n_for_sampling: 30

calculate_rmsd: true

# Injection disabled by default for MYB (matches config_myb.py: injection_enabled = False).
injection_enabled: false
injection_interval: 3
n_seqs_to_inject: 50
injection_sources:
  proteinmpnn_batch:
    type: "proteinmpnn_batch"
    path: "${SCALE_ASSETS}/my_design/myb/batch_outputs"
