# TRKA target config. Best-effort port -- lower priority than myb/her2 per
# the approved plan. TODO(user): verify af3_structure_dir paths and CSV
# freshness before running a real optimization; two candidate structure
# dirs exist on disk (af3_rfdiffusion_trka and af3_rfdiffusion_trka_corrected),
# both contain real *_model.cif outputs for the same af3_output_dir names --
# this config picks the "_corrected" one as more likely current, but confirm
# against the freshest run before trusting results.
target_name: trka

target_sequence: "VSFPASVQLHTAVEMHHWCIPFSVDGQPAPSLRWLFNGSVLNETSFIFTEFLEPAANETVRHGCLRLNQPTHVNNGNYTLLAANPFGQASASIMAAFMDNP"

initial_csv: "${SCALE_ASSETS}/benchmark_TRKA_rfdiffusion.csv"
af3_structure_dir: "${SCALE_ASSETS}/af3_rfdiffusion_trka_corrected"
af3_target_msa_dir: "${SCALE_ASSETS}/target_msa_cache"

reference_structures_dir: "${SCALE_ASSETS}/targets/designbb"
calculate_rmsd: false

n_iterations: 30
mutants_per_round: 30
top_n_for_sampling: 30

af3_thresholds:
  ptm_binder: 0.7

metric_weights:
  nll: -25.0
