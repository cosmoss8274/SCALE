[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-binderopt"
version = "0.2.0"
description = "Structure-conditioned active learning for binder optimisation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yi Chai" }]
keywords = ["protein-design", "binder-design", "active-learning", "boltz", "structure-prediction"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "fair-esm>=2.0.0",
    "biopython>=1.81",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
boltz = ["boltz>=2.0"]
notebook = ["notebook>=7.0", "py3Dmol>=2.0"]
dev = ["pytest>=7.0", "nbformat>=5.9", "nbclient>=0.9"]

[project.urls]
Homepage = "https://github.com/cosmoss8274/SCALE"
Issues = "https://github.com/cosmoss8274/SCALE/issues"


[tool.setuptools.packages.find]
include = ["binderopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model downloads and minutes of CPU (deselect with -m 'not slow')"]

[tool.setuptools.package-data]
binderopt = ["configs/*.yaml", "configs/targets/*.yaml"]
